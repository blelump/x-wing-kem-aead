[package]
name = "xwing-aead-example"
version = "0.1.0"
edition = "2021"  # Use stable edition for compatibility

[dependencies]
# Real X-Wing KEM - using the actual crate
x-wing = { version = "0.1.0-pre.2", features = ["os_rng"] }

# AEAD implementation  
chacha20poly1305 = "0.10"
aead = "0.5"

# Random number generation
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Utilities
zeroize = "1.8"
kem = "0.4.0-pre.1"
rand_core = { version = "0.9", features = ["os_rng"] }
hkdf = "0.12.4"
sha2 = "0.10.9"
